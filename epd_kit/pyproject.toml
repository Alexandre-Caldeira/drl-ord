[project]
name = "epd-kit"
version = "0.1.0"
description = ""
authors = [
    {name = "Alexandre-Caldeira",email = "alexandre.caldeira@ufv.br"}
]
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "torch (>=2.7.0,<3.0.0)",
    "mlflow (>=2.22.0,<3.0.0)",
    "optuna (>=4.3.0,<5.0.0)",
    "seaborn (>=0.13.2,<0.14.0)",
    "ipykernel (>=6.29.5,<7.0.0)",
    "tensorboard (>=2.19.0,<3.0.0)",
    "xgboost (>=3.0.2,<4.0.0)",
    "lightgbm (>=4.6.0,<5.0.0)",
    "catboost (>=1.2.8,<2.0.0)"
]

[tool.poetry]
packages = [{include = "epd_kit", from = "src"}]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
